<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bird Revenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Patrick+Hand&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game"></div>
    <canvas id="guide"></canvas>
    <div id="debug" hidden>
      <canvas id="debug-canvas" width="320" height="330"></canvas>
      <pre id="debug-text"></pre>
    </div>
    <div id="status"></div>
    <div id="help">Flap both arms to fly · spread them out to glide (tilt to slide) · raise a leg sideways (shoot) to poo · keyboard: ↑ flap, ←/→ steer, Shift glide, ↓ poo · Space/P pause · D debug · G tuning · K keyboard mode · C recalibrate · R record</div>
    <video id="camera" playsinline muted></video>
    <script type="module" src="/src/main.ts"></script>
  </body>
