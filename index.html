<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <!-- added to the home screen (the only full screen an iPhone gives a page): no browser bars -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bird Revenge" />
    <title>Bird Revenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Luckiest+Guy&family=Peralta&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
    <script data-goatcounter="https://carpique.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <canvas id="guide"></canvas>
    <div id="debug" hidden>
      <canvas id="debug-canvas" width="320" height="330"></canvas>
      <pre id="debug-text"></pre>
    </div>
    <div id="status"></div>
    <div id="rotate"></div>
    <div id="corner"></div>
    <video id="camera" playsinline muted></video>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
